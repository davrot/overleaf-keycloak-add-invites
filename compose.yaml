services:
  checkuser:
    image: "check_user_image"
    container_name: checkuser
    hostname: checkuser
    restart: always

    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - overleaf-network

    entrypoint: >
      /bin/sh -c "pip install argh && cd / && sleep infinity"


networks:
  overleaf-network:
    external: true